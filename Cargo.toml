[package]
name = "qubit-cpp-infra-pages"
version = "0.1.0"
edition = "2024"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
rust-version = "1.94"
license = "Apache-2.0"
description = "Safe portable documentation sites for cpp-infra"
repository = "https://github.com/qubit-ltd/cpp-infra-pages"
include = ["src/**", "build.rs", "conf/**", "assets/**", "schemas/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "README.zh_CN.md", "rust-toolchain.toml"]

[[bin]]
name = "cpp-infra-pages"
path = "src/main.rs"

[dependencies]
ammonia = "^4.0"
chrono = { version = "^0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "^4.5", features = ["derive"] }
ctrlc = "^3.0"
flate2 = "^1.1"
fs2 = "^0.4"
nix = { version = "^0.30", features = ["signal", "process"] }
pulldown-cmark = "^0.13"
regex = "^1.13"
scraper = "^0.25"
cssparser = "^0.38"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
sha2 = "^0.11"
tar = "^0.4"
tempfile = "^3.27"
thiserror = "^2.0"
toml = "^0.9"
url = "^2.5"
walkdir = "^2.5"

[dev-dependencies]
